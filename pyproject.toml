[project]
name = "qwen-embed"
version = "0.1.0"
description = "Frozen Qwen text/image embeddings and image captions."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "huggingface-hub==1.33.0",
    "numpy==2.4.6",
    "pillow==12.3.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.19.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
markers = ["gpu: needs CUDA and downloaded weights"]
